onboarding = false
[theme]
name = "terminal"

[ui]
sidebar_width = 20
hide_tab_bar_when_single_tab = true
sidebar_min_width = 18
sidebar_max_width = 26
pane_borders = "auto"
pane_outer_borders = false
pane_scrollbars = false
pane_gaps = false
status_indicators = "dots"
agent_panel_sort = "priority"
prompt_new_workspace_name = true

[ui.toast]
delivery = "herdr"

[ui.sidebar.spaces]
row_gap = 0
rows = [["state_icon", "workspace", { token = "branch", dim = true }]]

[ui.sidebar.agents]
row_gap = 0
rows = [["state_icon", { token = "agent", bold = true }, { token = "workspace", dim = true }]]
